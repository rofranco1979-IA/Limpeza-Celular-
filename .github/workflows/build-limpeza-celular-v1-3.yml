name: Gerar APK Limpeza Celular V1.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/rofranco/limpezacelular
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LimpezaCelular"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rofranco.limpezacelular"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.rofranco.limpezacelular"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "1.3"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="Limpeza Celular">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/rofranco/limpezacelular/MainActivity.kt <<'EOF'
          package com.rofranco.limpezacelular

          import android.app.*
          import android.os.*
          import android.content.*
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import java.io.File
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var root: LinearLayout
              private lateinit var statusText: TextView
              private lateinit var progress: ProgressBar
              private lateinit var progressText: TextView
              private lateinit var results: LinearLayout
              private lateinit var scanButton: Button
              private val found = mutableListOf<File>()
              private var scannedFiles = 0L
              private var scannedBytes = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
                  updateStorage()
              }

              private fun card(): GradientDrawable = GradientDrawable().apply {
                  setColor(Color.WHITE)
                  cornerRadius = 28f
                  setStroke(1, Color.rgb(220,225,232))
              }

              private fun txt(t:String, size:Float, bold:Boolean=false)=TextView(this).apply{
                  text=t; textSize=size; setTextColor(Color.rgb(35,42,52))
                  if(bold) setTypeface(typeface,Typeface.BOLD)
                  setPadding(8,8,8,8)
              }

              private fun buildUi() {
                  val scroll=ScrollView(this)
                  root=LinearLayout(this).apply{
                      orientation=LinearLayout.VERTICAL
                      setPadding(28,32,28,40)
                      setBackgroundColor(Color.rgb(244,247,251))
                  }
                  scroll.addView(root)
                  setContentView(scroll)

                  root.addView(txt("LIMPEZA CELULAR",28f,true))
                  root.addView(txt("Diagnóstico e limpeza segura",15f))

                  val storageCard=LinearLayout(this).apply{
                      orientation=LinearLayout.VERTICAL; setPadding(24,22,24,22); background=card()
                  }
                  statusText=txt("",19f,true)
                  storageCard.addView(statusText)
                  root.addView(storageCard, LinearLayout.LayoutParams(-1,-2).apply{setMargins(0,22,0,18)})

                  val scanCard=LinearLayout(this).apply{
                      orientation=LinearLayout.VERTICAL; setPadding(24,22,24,22); background=card()
                  }
                  scanCard.addView(txt("VERIFICAÇÃO",20f,true))
                  progress=ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal).apply{max=100;progress=0}
                  scanCard.addView(progress,LinearLayout.LayoutParams(-1,18).apply{setMargins(0,16,0,10)})
                  progressText=txt("Pronto para verificar.",15f)
                  scanCard.addView(progressText)

                  scanButton=Button(this).apply{
                      text="INICIAR VERIFICAÇÃO"
                      setOnClickListener{startScan()}
                  }
                  scanCard.addView(scanButton)
                  scanCard.addView(Button(this).apply{
                      text="PERMITIR ACESSO AOS ARQUIVOS"
                      setOnClickListener{permission()}
                  })
                  root.addView(scanCard,LinearLayout.LayoutParams(-1,-2).apply{setMargins(0,0,0,18)})

                  results=LinearLayout(this).apply{
                      orientation=LinearLayout.VERTICAL; setPadding(24,22,24,22); background=card()
                  }
                  results.addView(txt("RESULTADOS",20f,true))
                  results.addView(txt("Aguardando verificação.",15f))
                  root.addView(results)
              }

              private fun formatBytes(v:Long):String{
                  val gb=v/1073741824.0
                  return if(gb>=1) String.format("%.2f GB",gb) else String.format("%.1f MB",v/1048576.0)
              }

              private fun updateStorage(){
                  val f=filesDir
                  val total=f.totalSpace; val free=f.freeSpace; val used=total-free
                  val pct=if(total>0)(used*100/total).toInt() else 0
                  val health=when{pct>=95->"CRÍTICO";pct>=85->"ATENÇÃO";else->"SAUDÁVEL"}
                  statusText.text="Armazenamento: $health\n\n$totalLabel${formatBytes(total)}\nUsado: ${formatBytes(used)}  •  $pct%\nLivre: ${formatBytes(free)}"
              }
              private val totalLabel get()="Total: "

              private fun permission(){
                  if(Build.VERSION.SDK_INT>=30) startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,Uri.parse("package:$packageName")))
              }

              private fun startScan(){
                  if(Build.VERSION.SDK_INT>=30 && !android.os.Environment.isExternalStorageManager()){
                      Toast.makeText(this,"Autorize o acesso para fazer a varredura.",Toast.LENGTH_LONG).show()
                      permission(); return
                  }
                  scanButton.isEnabled=false
                  found.clear(); scannedFiles=0; scannedBytes=0
                  results.removeAllViews(); results.addView(txt("RESULTADOS",20f,true))
                  progress.progress=0
                  progressText.text="Iniciando varredura..."
                  thread{
                      val base=android.os.Environment.getExternalStorageDirectory()
                      walk(base)
                      runOnUiThread{showResults();scanButton.isEnabled=true;updateStorage()}
                  }
              }

              private fun walk(f:File){
                  try{
                      val arr=f.listFiles()?:return
                      arr.forEachIndexed{i,it->
                          if(it.isDirectory) walk(it) else{
                              scannedFiles++; scannedBytes+=it.length()
                              if(it.length()>=10L*1024*1024) synchronized(found){found.add(it)}
                              if(scannedFiles%75L==0L){
                                  val count=scannedFiles
                                  val size=scannedBytes
                                  runOnUiThread{
                                      progress.isIndeterminate=true
                                      progressText.text="Verificando... $count arquivos analisados\n${formatBytes(size)} percorridos • ${found.size} arquivos grandes encontrados"
                                  }
                              }
                          }
                      }
                  }catch(_:Exception){}
              }

              private fun showResults(){
                  progress.isIndeterminate=false;progress.progress=100
                  progressText.text="Concluído • $scannedFiles arquivos analisados • ${formatBytes(scannedBytes)} verificados"
                  val items=found.sortedByDescending{it.length()}.take(250)
                  results.removeAllViews()
                  results.addView(txt("RESULTADOS",20f,true))
                  results.addView(txt("${items.size} arquivos grandes encontrados",16f,true))
                  results.addView(txt("Marque somente o que você reconhece e deseja apagar.",14f))
                  items.forEach{f->
                      results.addView(CheckBox(this).apply{
                          text="${f.name}\n${formatBytes(f.length())}  •  ${f.parent ?: ""}"
                          tag=f
                      })
                  }
                  if(items.isEmpty()) results.addView(txt("Nenhum arquivo acima de 10 MB encontrado.",15f))
                  else results.addView(Button(this).apply{text="EXCLUIR SELECIONADOS";setOnClickListener{confirmDelete()}})
              }

              private fun confirmDelete(){
                  val chosen=(0 until results.childCount).mapNotNull{results.getChildAt(it) as? CheckBox}.filter{it.isChecked}.map{it.tag as File}
                  if(chosen.isEmpty()){Toast.makeText(this,"Selecione os arquivos.",Toast.LENGTH_SHORT).show();return}
                  val bytes=chosen.sumOf{it.length()}
                  AlertDialog.Builder(this).setTitle("Confirmar limpeza")
                      .setMessage("Você selecionou ${chosen.size} arquivo(s), totalizando ${formatBytes(bytes)}.\n\nConfira antes de excluir. A ação não pode ser desfeita.")
                      .setNegativeButton("Cancelar",null)
                      .setPositiveButton("EXCLUIR"){_,_->
                          var n=0;chosen.forEach{if(it.delete())n++}
                          Toast.makeText(this,"$n arquivo(s) excluído(s).",Toast.LENGTH_LONG).show()
                          updateStorage();startScan()
                      }.show()
              }
          }


      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Limpeza-Celular-V1-3
          path: app/build/outputs/apk/debug/app-debug.apk
